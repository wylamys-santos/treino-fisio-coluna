<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="gluteGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="spineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" rx="20" fill="url(#bgGrad)"/>
  
  <!-- Grid Lines / Floor Reference -->
  <line x1="50" y1="480" x2="750" y2="480" stroke="#334155" stroke-width="3" stroke-dasharray="6,6"/>
  <rect x="100" y="475" width="600" height="12" rx="6" fill="#3b82f6" opacity="0.3"/>
  <text x="400" y="510" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="13" text-anchor="middle">Colchonete de treino / Solo</text>

  <!-- Title Badge -->
  <rect x="40" y="30" width="455" height="44" rx="10" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
  <text x="55" y="58" fill="#c7d2fe" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700">ELEVAÇÃO PÉLVICA NO CHÃO (PONTE)</text>

  <!-- Target Muscle Tag -->
  <rect x="515" y="30" width="245" height="44" rx="10" fill="#831843" stroke="#f43f5e" stroke-width="1.5"/>
  <text x="637" y="58" fill="#fecdd3" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="600" text-anchor="middle">🎯 Foco: Glúteo Máximo</text>

  <!-- Biomechanical Figure - Supine Bridge -->
  <!-- Head & Upper Back -->
  <circle cx="210" cy="445" r="26" fill="#94a3b8"/>
  <path d="M 210 435 Q 220 440 220 455" stroke="#cbd5e1" stroke-width="3" fill="none"/>
  
  <!-- Upper Back / Shoulders on mat -->
  <path d="M 230 450 Q 260 455 290 445" stroke="#64748b" stroke-width="32" stroke-linecap="round"/>

  <!-- Arms along the ground for stability -->
  <path d="M 260 455 L 350 465" stroke="#475569" stroke-width="16" stroke-linecap="round"/>
  <circle cx="360" cy="465" r="9" fill="#64748b"/>

  <!-- Torso / Spine Alignment Line (Straight diagonal from shoulder to knee) -->
  <line x1="280" y1="440" x2="540" y2="300" stroke="#10b981" stroke-width="4" stroke-dasharray="8,5" filter="url(#glow)"/>
  
  <!-- Torso Body Mass -->
  <path d="M 280 440 L 410 370 L 460 340 L 430 320 L 300 390 Z" fill="#334155" opacity="0.8"/>

  <!-- Pelvis & Glute Complex (Contracted at the top) -->
  <ellipse cx="440" cy="350" rx="42" ry="32" transform="rotate(-30 440 350)" fill="url(#gluteGrad)" filter="url(#glow)"/>
  <text x="440" y="353" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">GLÚTEO</text>
  <text x="440" y="369" fill="#fdf2f8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">CONTRAÍDO</text>

  <!-- Thigh (Femur from hip to knee) -->
  <path d="M 455 345 L 560 300" stroke="#cbd5e1" stroke-width="34" stroke-linecap="round"/>
  
  <!-- Knee Joint -->
  <circle cx="560" cy="300" r="18" fill="#38bdf8"/>
  <text x="560" y="270" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">Joelho 90°</text>

  <!-- Shin / Lower Leg down to foot -->
  <path d="M 560 300 L 570 460" stroke="#94a3b8" stroke-width="26" stroke-linecap="round"/>

  <!-- Foot flat on floor -->
  <path d="M 545 470 L 610 470 L 605 455 L 565 455 Z" fill="#64748b"/>

  <!-- Arrows and Motion Cues -->
  <!-- Upward Pelvic Drive Arrow -->
  <g transform="translate(430, 240)">
    <line x1="0" y1="50" x2="0" y2="0" stroke="#ec4899" stroke-width="6" stroke-linecap="round"/>
    <polygon points="-12,10 12,10 0,-10" fill="#ec4899"/>
    <text x="20" y="25" fill="#f472b6" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">Elevar Quadril</text>
  </g>

  <!-- Heel Drive Arrow -->
  <g transform="translate(580, 410)">
    <line x1="0" y1="0" x2="0" y2="35" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <polygon points="-8,30 8,30 0,45" fill="#38bdf8"/>
    <text x="15" y="20" fill="#7dd3fc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Empurrar Calcanhares</text>
  </g>

  <!-- Lumbar Safety Annotation -->
  <rect x="250" y="195" width="225" height="52" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="362" y="217" fill="#6ee7b7" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">✓ Alinhamento Neutro</text>
  <text x="362" y="236" fill="#a7f3d0" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" text-anchor="middle">Sem hiperextender a lombar</text>
  <line x1="362" y1="248" x2="350" y2="380" stroke="#10b981" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Bottom Technical Checklist (2 Linhas enquadradas) -->
  <rect x="40" y="528" width="720" height="54" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="56" y="551" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700">
    💡 Dica Clínica: <tspan fill="#cbd5e1" font-weight="400">Aperte o glúteo no topo da subida por 1 a 2 segundos com força.</tspan>
  </text>
  <text x="56" y="571" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">
    Pare exatamente na linha reta (ombro-quadril-joelho). Não arqueie as costas nem jogue a barriga para cima.
  </text>
</svg>
