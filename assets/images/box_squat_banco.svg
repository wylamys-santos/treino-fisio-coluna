<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="quadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" rx="20" fill="url(#bgGrad4)"/>
  
  <!-- Floor Reference -->
  <line x1="50" y1="500" x2="750" y2="500" stroke="#334155" stroke-width="3" stroke-dasharray="6,6"/>
  <rect x="100" y="495" width="600" height="12" rx="6" fill="#0284c7" opacity="0.3"/>
  <text x="400" y="520" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="13" text-anchor="middle">Solo da Academia - Pés Firmes na Largura dos Ombros</text>

  <!-- Title Badge -->
  <rect x="40" y="30" width="465" height="44" rx="10" fill="#0c4a6e" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="55" y="58" fill="#e0f2fe" font-family="system-ui, -apple-system, sans-serif" font-size="16.5" font-weight="700">AGACHAMENTO SENTA E LEVANTA (NO BANCO)</text>

  <!-- Target Muscle Tag -->
  <rect x="520" y="30" width="240" height="44" rx="10" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="640" y="58" fill="#dbeafe" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="600" text-anchor="middle">🎯 Foco: Quadríceps + Glúteo</text>

  <!-- Gym Bench / Box (Stable Support) -->
  <rect x="140" y="360" width="130" height="135" rx="8" fill="#334155" stroke="#64748b" stroke-width="2"/>
  <rect x="130" y="350" width="150" height="20" rx="5" fill="#475569"/>
  <text x="205" y="430" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">Banco / Caixa</text>
  <text x="205" y="450" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" text-anchor="middle">Altura do Joelho</text>

  <!-- Biomechanical Figure - Sitting to Standing Position -->
  <!-- Head & Forward gaze -->
  <circle cx="340" cy="180" r="26" fill="#94a3b8"/>
  <path d="M 345 175 L 360 180" stroke="#cbd5e1" stroke-width="3"/>

  <!-- Arms extended forward for balance and counterweight -->
  <path d="M 340 215 L 470 215" stroke="#64748b" stroke-width="18" stroke-linecap="round"/>
  <circle cx="480" cy="215" r="9" fill="#94a3b8"/>
  <text x="470" y="195" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">Braços à Frente (Equilíbrio)</text>

  <!-- Torso with Neutral Spine Inclination -->
  <path d="M 340 210 L 290 350" stroke="#475569" stroke-width="38" stroke-linecap="round"/>
  <!-- Safe neutral spine overlay -->
  <line x1="340" y1="200" x2="290" y2="350" stroke="#10b981" stroke-width="5" stroke-dasharray="6,4" filter="url(#glow4)"/>

  <!-- Pelvis touching the bench edge -->
  <ellipse cx="280" cy="355" rx="34" ry="24" fill="#a855f7"/>
  <text x="250" y="325" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700">Tocar o banco</text>

  <!-- Thigh (Quadríceps loaded in active angle) -->
  <path d="M 290 350 L 440 370" stroke="url(#quadGrad)" stroke-width="36" stroke-linecap="round" filter="url(#glow4)"/>
  <text x="365" y="365" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">QUADRÍCEPS</text>

  <!-- Knee Joint (Kept behind toes, aligned with feet) -->
  <circle cx="440" cy="370" r="18" fill="#0284c7"/>
  <text x="440" y="340" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">Joelho Estável</text>

  <!-- Shin down to foot -->
  <path d="M 440 370 L 435 490" stroke="#64748b" stroke-width="24" stroke-linecap="round"/>

  <!-- Feet flat on floor -->
  <path d="M 410 495 L 480 495 L 470 480 L 420 480 Z" fill="#94a3b8"/>

  <!-- Motion arrows: Senta devagar e sobe firme -->
  <g transform="translate(560, 290)">
    <line x1="0" y1="60" x2="0" y2="0" stroke="#0ea5e9" stroke-width="6" stroke-linecap="round"/>
    <polygon points="-10,12 10,12 0,-8" fill="#0ea5e9"/>
    <text x="18" y="20" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">1. Subir com Força</text>
    
    <line x1="0" y1="70" x2="0" y2="130" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    <polygon points="-8,120 8,120 0,140" fill="#94a3b8"/>
    <text x="18" y="105" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600">2. Descer Controlado</text>
  </g>

  <!-- Axial Load Protection Banner (Zero Smith / Zero Barra nas costas) -->
  <rect x="340" y="90" width="420" height="65" rx="10" fill="#450a0a" stroke="#ef4444" stroke-width="2"/>
  <text x="550" y="115" fill="#fca5a5" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle">🚫 ZERO CARGA AXIAL (NADA DE SMITH!)</text>
  <text x="550" y="137" fill="#fee2e2" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" text-anchor="middle">Apenas peso corporal ou halter leve junto ao peito (Goblet)</text>

  <!-- Bottom Technical Checklist (2 Linhas enquadradas) -->
  <rect x="40" y="528" width="720" height="54" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="56" y="551" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700">
    🛡️ Segurança da Coluna: <tspan fill="#cbd5e1" font-weight="400">O banco serve como limitador seguro de profundidade.</tspan>
  </text>
  <text x="56" y="571" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">
    Ele impede que a pelve sofra retroversão ("bunda entrar"), blindando os discos L4-L5 contra pinçamentos.
  </text>
</svg>
