<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="extGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow5" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" rx="20" fill="url(#bgGrad5)"/>
  
  <!-- Title Badge -->
  <rect x="40" y="30" width="455" height="44" rx="10" fill="#0c4a6e" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="55" y="58" fill="#e0f2fe" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700">CADEIRA EXTENSORA (MÁQUINA SEGURA)</text>

  <!-- Target Muscle Tag -->
  <rect x="515" y="30" width="245" height="44" rx="10" fill="#1e3a8a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="637" y="58" fill="#e0f2fe" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="600" text-anchor="middle">🎯 Foco: Quadríceps Isolado</text>

  <!-- Machine Structure -->
  <!-- Seat Base & Upright Backrest -->
  <rect x="230" y="220" width="24" height="200" rx="8" fill="#1e293b" stroke="#0284c7" stroke-width="3"/>
  <rect x="230" y="400" width="160" height="24" rx="6" fill="#1e293b" stroke="#0284c7" stroke-width="3"/>
  
  <!-- Machine Pivot Axis -->
  <circle cx="390" cy="410" r="14" fill="#64748b" stroke="#94a3b8" stroke-width="3"/>
  <text x="390" y="445" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle">Eixo da Máquina</text>

  <!-- User Posture -->
  <!-- Back Fully Supported against Backrest -->
  <rect x="220" y="210" width="18" height="190" rx="6" fill="#047857"/>
  <text x="140" y="295" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Costas 100%</text>
  <text x="140" y="315" fill="#a7f3d0" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">Apoiadas no Encosto</text>
  <line x1="190" y1="305" x2="220" y2="305" stroke="#10b981" stroke-width="2"/>

  <!-- User Figure -->
  <circle cx="280" cy="180" r="26" fill="#94a3b8"/>
  <path d="M 270 210 L 270 400" stroke="#475569" stroke-width="38" stroke-linecap="round"/>
  
  <!-- Hands gripping machine side handles -->
  <path d="M 280 300 L 320 380" stroke="#64748b" stroke-width="14" stroke-linecap="round"/>
  <rect x="315" y="375" width="26" height="12" rx="4" fill="#0284c7"/>
  <text x="328" y="360" fill="#7dd3fc" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Segurar firme</text>

  <!-- Thigh resting on seat -->
  <path d="M 270 410 L 390 410" stroke="#334155" stroke-width="34" stroke-linecap="round"/>

  <!-- Extended Leg / Shin (Moving up) -->
  <path d="M 390 410 L 580 380" stroke="url(#extGrad)" stroke-width="32" stroke-linecap="round" filter="url(#glow5)"/>
  
  <!-- Quadriceps Active Glow Text -->
  <text x="470" y="360" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800">QUADRÍCEPS</text>
  <text x="470" y="375" fill="#cffafe" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">ISOLAMENTO TOTAL</text>

  <!-- Machine Roller Pad resting on lower shin/ankle -->
  <circle cx="580" cy="380" r="22" fill="#0369a1" stroke="#38bdf8" stroke-width="3"/>
  <text x="580" y="345" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Almofada no Tornozelo</text>

  <!-- Foot in natural plantar flexion -->
  <path d="M 580 380 L 630 395" stroke="#94a3b8" stroke-width="16" stroke-linecap="round"/>

  <!-- Motion Arc Arrow -->
  <path d="M 460 480 A 100 100 0 0 0 570 415" fill="none" stroke="#06b6d4" stroke-width="6" stroke-linecap="round"/>
  <polygon points="560,410 580,410 575,430" fill="#06b6d4"/>
  <text x="590" y="455" fill="#22d3ee" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">Extensão Controlada</text>

  <!-- Clinical Safety Card (Enquadrada perfeitamente) -->
  <rect x="410" y="105" width="350" height="98" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
  <text x="428" y="130" fill="#6ee7b7" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700">✓ Por que é segura na hérnia:</text>
  <text x="428" y="153" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">1. Coluna 100% apoiada e travada no encosto</text>
  <text x="428" y="173" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">2. Zero retroversão pélvica (diferente do Leg Press)</text>
  <text x="428" y="192" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11">Pausa de 1s no topo sem dar tranco no joelho.</text>

  <!-- Bottom Technical Checklist (2 Linhas enquadradas) -->
  <rect x="40" y="528" width="720" height="54" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="56" y="551" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700">
    ⚙️ Ajuste da Máquina: <tspan fill="#cbd5e1" font-weight="400">Alinhe a dobra do joelho com o eixo de rotação da máquina.</tspan>
  </text>
  <text x="56" y="571" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">
    Mantenha as mãos firmes nas manoplas para não desencostar as costas nem a bacia durante o esforço.
  </text>
</svg>
