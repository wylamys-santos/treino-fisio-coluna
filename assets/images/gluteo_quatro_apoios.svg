<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="gluteExtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d946ef"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" rx="20" fill="url(#bgGrad3)"/>
  
  <!-- Floor / Mat Reference -->
  <line x1="50" y1="480" x2="750" y2="480" stroke="#334155" stroke-width="3" stroke-dasharray="6,6"/>
  <rect x="100" y="475" width="600" height="12" rx="6" fill="#3b82f6" opacity="0.3"/>
  <text x="400" y="510" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="13" text-anchor="middle">Colchonete - Posição em 4 Apoios (Punhos sob Ombros, Joelhos sob Quadril)</text>

  <!-- Title Badge -->
  <rect x="40" y="30" width="455" height="44" rx="10" fill="#3b0764" stroke="#c084fc" stroke-width="1.5"/>
  <text x="55" y="58" fill="#f5d0fe" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700">GLÚTEO 4 APOIOS COM CANELEIRA</text>

  <!-- Target Muscle Tag -->
  <rect x="515" y="30" width="245" height="44" rx="10" fill="#701a75" stroke="#e879f9" stroke-width="1.5"/>
  <text x="637" y="58" fill="#fae8ff" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="600" text-anchor="middle">🎯 Foco: Glúteo Máximo</text>

  <!-- 4-Apoios Base Figure -->
  <!-- Head & Neck in neutral downward gaze -->
  <circle cx="200" cy="270" r="26" fill="#94a3b8"/>
  <path d="M 200 270 L 190 300" stroke="#64748b" stroke-width="12" stroke-linecap="round"/>

  <!-- Arms Supporting Body (Directly beneath shoulders) -->
  <path d="M 240 280 L 230 460" stroke="#64748b" stroke-width="20" stroke-linecap="round"/>
  <ellipse cx="230" cy="465" rx="18" ry="8" fill="#475569"/>
  <text x="230" y="495" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" text-anchor="middle">Braços Firmes</text>

  <!-- Torso & Neutral Spine Line -->
  <path d="M 230 280 L 440 280" stroke="#475569" stroke-width="38" stroke-linecap="round"/>
  <line x1="220" y1="260" x2="450" y2="260" stroke="#10b981" stroke-width="4" stroke-dasharray="6,4" filter="url(#glow3)"/>
  
  <!-- Supporting Knee & Thigh (Base) -->
  <path d="M 400 290 L 390 460" stroke="#475569" stroke-width="24" stroke-linecap="round"/>
  <circle cx="390" cy="460" r="14" fill="#3b82f6"/>

  <!-- Active Leg extending backwards/upwards with 90° knee -->
  <!-- Gluteus Maximus Highlight -->
  <ellipse cx="440" cy="285" rx="36" ry="28" fill="url(#gluteExtGrad)" filter="url(#glow3)"/>
  <text x="440" y="283" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">GLÚTEO</text>
  <text x="440" y="299" fill="#fdf4ff" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" text-anchor="middle">ATIVADO</text>

  <!-- Thigh lifted horizontally parallel to floor -->
  <path d="M 450 280 L 590 280" stroke="#cbd5e1" stroke-width="28" stroke-linecap="round"/>
  
  <!-- Active Knee bent 90° -->
  <circle cx="590" cy="280" r="16" fill="#ec4899"/>

  <!-- Lower Leg pointing straight up toward ceiling -->
  <path d="M 590 280 L 590 140" stroke="#94a3b8" stroke-width="22" stroke-linecap="round"/>

  <!-- Ankle Weight (Caneleira) -->
  <rect x="568" y="170" width="44" height="42" rx="8" fill="#f59e0b" stroke="#fbbf24" stroke-width="2"/>
  <text x="590" y="196" fill="#78350f" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" text-anchor="middle">PESO</text>

  <!-- Foot flexed pointing sole to ceiling -->
  <path d="M 570 140 L 620 140" stroke="#64748b" stroke-width="14" stroke-linecap="round"/>
  <text x="640" y="145" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700">Sola do pé p/ o teto</text>

  <!-- Upward motion arrow -->
  <g transform="translate(620, 220)">
    <line x1="0" y1="40" x2="0" y2="0" stroke="#d946ef" stroke-width="6" stroke-linecap="round"/>
    <polygon points="-10,8 10,8 0,-8" fill="#d946ef"/>
    <text x="15" y="22" fill="#e879f9" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700">Subir sem arquear</text>
  </g>

  <!-- Critical Safety Indicator: Lumbar Neutral -->
  <rect x="250" y="155" width="235" height="58" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
  <text x="367" y="178" fill="#6ee7b7" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">✓ Coluna Reta e Travada</text>
  <text x="367" y="198" fill="#a7f3d0" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" text-anchor="middle">Abdômen firme (não arqueie!)</text>
  <line x1="367" y1="213" x2="350" y2="260" stroke="#10b981" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Bottom Technical Checklist (2 Linhas enquadradas) -->
  <rect x="40" y="528" width="720" height="54" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="56" y="551" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700">
    ⚠️ Atenção Máxima: <tspan fill="#cbd5e1" font-weight="400">Suba apenas até a linha do tronco, sem dar chutes altos.</tspan>
  </text>
  <text x="56" y="571" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">
    Não balance o tronco. Manter a coluna neutra poupa os discos vertebrais e isola o glúteo de verdade.
  </text>
</svg>
