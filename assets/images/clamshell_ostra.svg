<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="gluteMedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" rx="20" fill="url(#bgGrad2)"/>
  
  <!-- Floor / Mat Reference -->
  <line x1="50" y1="490" x2="750" y2="490" stroke="#334155" stroke-width="3" stroke-dasharray="6,6"/>
  <rect x="100" y="485" width="600" height="12" rx="6" fill="#8b5cf6" opacity="0.3"/>
  <text x="400" y="515" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="13" text-anchor="middle">Colchonete de treino - Posição Deitado de Lado</text>

  <!-- Title Badge -->
  <rect x="40" y="30" width="465" height="44" rx="10" fill="#2e1065" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="55" y="58" fill="#e9d5ff" font-family="system-ui, -apple-system, sans-serif" font-size="16.5" font-weight="700">ABDUÇÃO DE QUADRIL / OSTRA (CLAMSHELL)</text>

  <!-- Target Muscle Tag -->
  <rect x="520" y="30" width="240" height="44" rx="10" fill="#4c1d95" stroke="#a855f7" stroke-width="1.5"/>
  <text x="640" y="58" fill="#f3e8ff" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="600" text-anchor="middle">🎯 Foco: Glúteo Médio</text>

  <!-- Biomechanical Figure - Side Lying Clamshell -->
  <!-- Head & Support Arm -->
  <circle cx="180" cy="410" r="26" fill="#94a3b8"/>
  <path d="M 180 436 L 200 470 L 150 480" stroke="#64748b" stroke-width="14" stroke-linecap="round" fill="none"/>
  
  <!-- Torso lying sideways, neutral straight spine -->
  <path d="M 200 420 L 370 420" stroke="#475569" stroke-width="38" stroke-linecap="round"/>
  <line x1="200" y1="420" x2="380" y2="420" stroke="#10b981" stroke-width="4" stroke-dasharray="6,4"/>

  <!-- Pelvis & Gluteus Medius Focus (Top Hip) -->
  <ellipse cx="380" cy="405" rx="42" ry="32" fill="url(#gluteMedGrad)" filter="url(#glow2)"/>
  <text x="380" y="403" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">GLÚTEO</text>
  <text x="380" y="419" fill="#ede9fe" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">MÉDIO</text>

  <!-- Lower Leg (Resting on Mat) -->
  <path d="M 380 435 L 490 465 L 560 470" stroke="#334155" stroke-width="24" stroke-linecap="round" fill="none"/>

  <!-- Upper Leg (Abducting upwards - Clamshell opening) -->
  <path d="M 385 395 L 495 320" stroke="#cbd5e1" stroke-width="30" stroke-linecap="round"/>
  <!-- Top Knee -->
  <circle cx="495" cy="320" r="17" fill="#8b5cf6"/>

  <!-- Lower leg bent back to feet -->
  <path d="M 495 320 L 560 460" stroke="#94a3b8" stroke-width="22" stroke-linecap="round"/>

  <!-- Elastic Miniband loop around knees -->
  <ellipse cx="485" cy="390" rx="20" ry="60" fill="none" stroke="#f43f5e" stroke-width="7" stroke-dasharray="14,4"/>
  <rect x="520" y="375" width="130" height="28" rx="6" fill="#be123c"/>
  <text x="585" y="394" fill="#fff" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">Miniband Elástica</text>

  <!-- Feet glued together at heels -->
  <circle cx="560" cy="465" r="14" fill="#38bdf8"/>
  <text x="615" y="470" fill="#7dd3fc" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600">Pés e Calcanhares Unidos</text>

  <!-- Motion Arc Arrow (Opening Top Knee) -->
  <path d="M 480 430 A 70 70 0 0 0 495 340" fill="none" stroke="#a855f7" stroke-width="6" stroke-linecap="round"/>
  <polygon points="485,340 505,335 498,355" fill="#a855f7"/>
  <text x="515" y="300" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700">Abrir Joelho Superior</text>

  <!-- Spine / Pelvic Rotation Warning (Crucial for Disc Herniation!) -->
  <rect x="230" y="240" width="260" height="58" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
  <text x="360" y="263" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">✓ Bloqueio Pélvico Seguro</text>
  <text x="360" y="283" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" text-anchor="middle">NÃO gire o tronco para trás!</text>
  <line x1="360" y1="298" x2="380" y2="370" stroke="#10b981" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Bottom Technical Checklist (2 Linhas enquadradas) -->
  <rect x="40" y="528" width="720" height="54" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="56" y="551" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700">
    💡 Estabilizador da Marcha: <tspan fill="#cbd5e1" font-weight="400">O glúteo médio estabiliza a bacia e equilibra cada passada.</tspan>
  </text>
  <text x="56" y="571" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">
    Ele impede o desabamento pélvico ao caminhar, protegendo os discos L4-L5 e S1 contra forças rotacionais.
  </text>
</svg>
