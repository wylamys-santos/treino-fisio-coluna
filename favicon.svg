<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1120"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#062b22"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="vertebraGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="#10b981" stroke-width="8" stroke-opacity="0.8"/>

  <!-- Radial Glow Behind Shield -->
  <circle cx="256" cy="256" r="180" fill="url(#glow)"/>

  <!-- Protective Shield Contour -->
  <path d="M256 75 C380 105, 390 250, 340 345 C295 425, 256 440, 256 440 C256 440, 217 425, 172 345 C122 250, 132 105, 256 75 Z" 
        fill="#091c1e" fill-opacity="0.75" stroke="url(#shieldGrad)" stroke-width="10" stroke-linejoin="round" filter="url(#softGlow)"/>

  <!-- Spine Column - Biomechanical Segmented Vertebrae -->
  <!-- Top Vertebra (C/T) -->
  <rect x="218" y="122" width="76" height="24" rx="10" fill="url(#vertebraGrad)"/>
  <circle cx="256" cy="134" r="5" fill="#047857"/>

  <!-- Disc Spacer 1 -->
  <rect x="238" y="152" width="36" height="8" rx="4" fill="#34d399"/>

  <!-- Vertebra 2 (Thoracic) -->
  <rect x="212" y="166" width="88" height="26" rx="12" fill="url(#vertebraGrad)"/>
  <circle cx="256" cy="179" r="5" fill="#047857"/>

  <!-- Disc Spacer 2 -->
  <rect x="235" y="198" width="42" height="9" rx="4" fill="#34d399"/>

  <!-- Vertebra 3 (Lumbar L1-L3) -->
  <rect x="204" y="214" width="104" height="30" rx="14" fill="url(#vertebraGrad)"/>
  <circle cx="256" cy="229" r="6" fill="#047857"/>

  <!-- Disc Spacer 3 (Protected Disc L4) -->
  <rect x="230" y="250" width="52" height="10" rx="5" fill="#6ee7b7"/>

  <!-- Vertebra 4 (Lumbar L4-L5 - Forte & Protegida) -->
  <ellipse cx="256" cy="278" rx="80" ry="26" fill="#10b981" fill-opacity="0.3"/>
  <rect x="194" y="265" width="124" height="36" rx="16" fill="#ffffff" stroke="#10b981" stroke-width="3" filter="url(#softGlow)"/>
  <circle cx="256" cy="283" r="7" fill="#059669"/>

  <!-- Disc Spacer 4 (L5-S1) -->
  <rect x="230" y="308" width="52" height="10" rx="5" fill="#6ee7b7"/>

  <!-- Sacrum (Base Estável) -->
  <path d="M214 324 L298 324 L276 374 C268 386, 244 386, 236 374 Z" fill="url(#shieldGrad)"/>
  <circle cx="256" cy="342" r="5" fill="#064e3b"/>

  <!-- Core Protection Waves (Transverso & Estabilidade Lombar) -->
  <path d="M145 250 Q125 280 145 310" stroke="#34d399" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M367 250 Q387 280 367 310" stroke="#34d399" stroke-width="6" stroke-linecap="round" fill="none"/>

  <!-- Top Sparkle -->
  <path d="M256 90 L260 99 L269 103 L260 107 L256 116 L252 107 L243 103 L252 99 Z" fill="#6ee7b7"/>
</svg>
